services:
  mongodb:
    image: mongo:7.0
    container_name: secure-notes-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - secure-notes-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure-notes-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      MONGODB_URI: mongodb://mongodb:27017/secure_notes
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - secure-notes-net

volumes:
  mongo_data:
    driver: local

networks:
  secure-notes-net:
    driver: bridge
